<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di Di Coffee</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* PHẦN CẬP NHẬT GIAO DIỆN: STYLE MÙA ĐÔNG / NOEL */
        
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Hiệu ứng nền tuyết rơi / lạnh giá mùa đông */
            background: linear-gradient(135deg, #b0c4de 0%, #e0f6ff 50%, #87ceeb 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Lớp nền hiệu ứng bông tuyết lấp lánh */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(2px 2px at 30px 40px, #ffffff, rgba(255, 255, 255, 0)),
                radial-gradient(3px 3px at 80px 120px, #ffffff, rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 150px 50px, #ffffff, rgba(255, 255, 255, 0)),
                radial-gradient(2.5px 2.5px at 200px 200px, #ffffff, rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 270px 90px, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
            background-size: 250px 250px;
            animation: snowfall 6s infinite linear;
        }

        @keyframes snowfall {
            0% { background-position: 0 0; }
            100% { background-position: 100px 250px; }
        }

        /* Khung Card chính mang phong cách len đan mùa đông ấm áp */
        .card {
            background: #fffaf5;
            /* Mô phỏng hoạ tiết len đan nhẹ hoặc texture mùa đông */
            background-image: radial-gradient(#e8d8c8 15%, transparent 16%), radial-gradient(#e8d8c8 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 2px solid #d4a373;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), inset 0 0 15px rgba(212, 163, 115, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 2;
            margin: 20px;
        }

        /* Tiêu đề trang trí hoa tuyết / mùa đông */
        #shopTitle {
            color: #8b0000;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Form input và nhãn */
        #form-input {
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #5c4033;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1.5px solid #d4a373;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #8b0000;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.2);
        }

        /* Nút Tích Điểm mang sắc đỏ Giáng sinh */
        #btnSubmit {
            width: 100%;
            background: linear-gradient(135deg, #a4161a 0%, #660708 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(164, 22, 26, 0.4);
            transition: all 0.3s ease;
            animation: pulse-button 2s infinite;
        }

        #btnSubmit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(164, 22, 26, 0.6);
        }

        @keyframes pulse-button {
            0% { box-shadow: 0 0 0 0 rgba(164, 22, 26, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(164, 22, 26, 0); }
            100% { box-shadow: 0 0 0 0 rgba(164, 22, 26, 0); }
        }

        /* Thanh menu điều hướng dưới dạng thẻ quà / mùa đông */
        .nav-menu {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #d4a373;
        }

        .nav-item {
            text-decoration: none;
            color: #5c4033;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 10px;
            background: #fdf6ec;
            border: 1px solid #e3d0b9;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-item.active, .nav-item:hover {
            background: #a4161a;
            color: white;
            border-color: #a4161a;
        }

        /* Thêm giữ nguyên các style cấu trúc cũ của bạn */
        #pointBox {
            display: none;
        }
    </style>

</head>
<body>
    <div class="card">
        <h2 id="shopTitle">⭐ Chào mừng Quốc Khánh: 02/09 ⭐</h2>
        <div id="form-input">
            <label>Tên khách hàng:</label>
            <input type="text" id="cusName" placeholder="Nhập tên của bạn">
            <label>Số điện thoại:</label>
            <input type="tel" id="cusPhone" placeholder="Nhập số điện thoại">
            <label>Mã tích điểm:</label>
            <input type="text" id="inputCode" placeholder="Nhập mã tích điểm">
            <button id="btnSubmit" onclick="handleVerify()">TÍCH ĐIỂM NGAY</button>
            <br><br><span style="color:#5d4037;font-weight:bold;">Zalo Đặt Trước: 0968.97.37.87</span>
        </div>
        <div id="pointBox" style="display:none;">
            <span id="currentPoints">0</span>
        </div> 
        <div id="result"></div>        
        <div class="nav-menu">
            <a href="index.html" class="nav-item active"><i>⭐</i> Tích điểm</a>
            <a href="danhsach.html" class="nav-item"><i>📜</i> Danh sách</a>
            <a href="doi-qua.html?from=webs" class="nav-item"><i>🎁</i> Xem quà</a>
        </div>
        <br><br><span style="color:#007b16;font-weight:bold;">15 điểm = 1 ly hay dùng</span>
        <br><span style="color:#990900;font-weight:bold;">Quét mã đổi điểm tại quầy</span>
    </div>

<script src="config.js"></script> 
<script>
    window.onload = function() {
        if (typeof CONFIG !== 'undefined' && CONFIG.SHOP_NAME) {
            document.getElementById('shopTitle').innerText = "☕ " + CONFIG.SHOP_NAME;
        }
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromURL = urlParams.get('code');
        const savedName = localStorage.getItem('didi_customer_name');
        const savedPhone = localStorage.getItem('didi_customer_phone');
        
        if (savedName) document.getElementById('cusName').value = savedName;
        if (savedPhone) document.getElementById('cusPhone').value = savedPhone;
        if (codeFromURL) document.getElementById('inputCode').value = codeFromURL.toUpperCase();
        
        if (codeFromURL && savedName && savedPhone) {
            setTimeout(handleVerify, 500);
        }
    };

    function handleVerify() {
        const name = document.getElementById('cusName').value.trim();
        const phone = document.getElementById('cusPhone').value.trim();
        const code = document.getElementById('inputCode').value.trim().toUpperCase();
        const resultDiv = document.getElementById('result');
        const btnSubmit = document.getElementById('btnSubmit');

        if (!name || !phone || !code) {
            resultDiv.innerHTML = "<div class='error'>❌ Vui lòng nhập đầy đủ thông tin!</div>";
            return;
        }

        const shopPhone = "0968973787";
        const cleanPhone = phone.replace(/\D/g, ""); 
        if (cleanPhone === shopPhone) {
            resultDiv.innerHTML = "<div class='error'>❌ Vui lòng nhập lại SĐT của bạn, Đây là số cửa hàng không thể tích điểm!</div>";
            return;
        }

        btnSubmit.disabled = true; 
        btnSubmit.innerHTML = "⌛ Đang tích điểm..."; 
        resultDiv.innerHTML = ""; 
        
        localStorage.setItem('didi_customer_name', name);
        localStorage.setItem('didi_customer_phone', phone);
        
        // --- LOGIC CẬP NHẬT ĐIỂM THEO MÃ ---
        let pointsToAdd = (CONFIG.POINTS_PER_CODE) ? parseFloat(CONFIG.POINTS_PER_CODE) : 1;

        if (code.startsWith("TA")) {
            pointsToAdd = pointsToAdd - 0;
        } else if (code.startsWith("SC")) {
            pointsToAdd = pointsToAdd + 0.25;
        }
        // ------------------------------------

        const safetyTimeout = setTimeout(function() {
            if (btnSubmit.disabled) {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "TÍCH ĐIỂM NGAY";
                resultDiv.innerHTML = "<div class='error'>❌ Kết nối chậm, vui lòng thử lại!</div>";
            }
        }, 20000);

        window.googleCallback = function(resData) {
            clearTimeout(safetyTimeout);
            btnSubmit.disabled = false;
            btnSubmit.innerText = "TÍCH ĐIỂM NGAY";

            if (resData.status === "SUCCESS") {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                const now = new Date();
                const timeStr = now.toLocaleDateString('vi-VN') + " " + now.toLocaleTimeString('vi-VN');
                resultDiv.innerHTML = `
                    <div class="success-box">
                        <div>✅ TÍCH ĐIỂM THÀNH CÔNG!</div>
                        <span class="time">Thời gian: ${timeStr}</span>
                        <span class="points-info">Số điểm hiện tại: <span>${resData.points}</span></span>
                    </div>
                `;  
                document.getElementById('inputCode').value = ""; 

                // Kiểm tra kết quả VIP trả về từ cột VIP (resData.vip) thay vì check điểm
                if (resData.vip && resData.vip.toUpperCase() === "VIP") {
                    setTimeout(function() {
                        alert("🎉 Chúc mừng bạn đã được nâng cấp lên thành viên VIP! Ưu đãi đặc quyền: Dùng 14 điểm để đổi 1 ly bất kỳ.");
                    }, 400);
                }

                if (resData.isTop1 === true) {
                    setTimeout(function() {
                        alert("Chúc mừng! Quý khách đang có số điểm tích lũy cao nhất: " + resData.points + " điểm.");
                    }, 800);
                }
            } 
            else if (resData.status === "USED") {
                resultDiv.innerHTML = `
                    <div class="success-box" style="background-color: #fff3e0; border-color: #ff9800; color: #e65100;">
                        <div>⚠️ Mã này đã được sử dụng.</div>
                        <span class="points-info">Số điểm hiện tại: <span>${resData.points}</span></span>
                    </div>
                `;
            } 
            else if (resData.status === "ERROR" && resData.message && resData.message.includes("không tồn tại")) {
                resultDiv.innerHTML = "<div class='error'>❌ Mã không tồn tại!</div>";
            }
            else {
                resultDiv.innerHTML = "<div class='error'>❌ " + (resData.message || "Lỗi hệ thống!") + "</div>";
            }
            
            const oldScript = document.getElementById('api-call');
            if (oldScript) oldScript.remove();
        };

        const scriptTag = document.createElement("script");
        scriptTag.id = "api-call";
        scriptTag.src = `${CONFIG.SCRIPT_URL}?action=tich_diem&code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&add_points=${pointsToAdd}&callback=googleCallback&t=${new Date().getTime()}`;        
        
        scriptTag.onerror = function() {
            clearTimeout(safetyTimeout);
            resultDiv.innerHTML = "<div class='error'>❌ Lỗi kết nối máy chủ!</div>";
            btnSubmit.disabled = false;
            btnSubmit.innerText = "TÍCH ĐIỂM NGAY";
            const oldScript = document.getElementById('api-call');
            if (oldScript) oldScript.remove();
        };
        document.body.appendChild(scriptTag);
    }
</script>
</body>
</html>
