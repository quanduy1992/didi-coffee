<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di Di Coffee</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Lớp nền phong cách mùa đông băng giá có hoa văn băng tuyết bao phủ */
            background: 
                radial-gradient(circle at 15% 15%, rgba(255,255,255,0.75) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255,255,255,0.65) 0%, transparent 45%),
                linear-gradient(135deg, #7899b4 0%, #a4c0d4 50%, #6386a3 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng tuyết rơi lấp lánh nhẹ nhàng khắp màn hình */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background-image: 
                radial-gradient(3px 3px at 40px 60px, #ffffff, rgba(255,255,255,0)),
                radial-gradient(4px 4px at 160px 200px, #ffffff, rgba(255,255,255,0)),
                radial-gradient(2.5px 2.5px at 290px 90px, #ffffff, rgba(255,255,255,0)),
                radial-gradient(3.5px 3.5px at 120px 320px, #ffffff, rgba(255,255,255,0));
            background-size: 320px 320px;
            animation: snowfall 7s infinite linear;
        }

        @keyframes snowfall {
            0% { background-position: 0 0; }
            100% { background-position: -50px 320px; }
        }

        /* Khung Card chính: Mô phỏng chất liệu áo len dệt kim vintage sang trọng đúng mẫu */
        .card {
            background-color: #f7f3ed;
            background-image: 
                radial-gradient(#e5dbcc 15%, transparent 16%), 
                radial-gradient(#e5dbcc 15%, transparent 16%);
            background-size: 18px 18px;
            background-position: 0 0, 9px 9px;
            border: 5px solid #ffffff;
            padding: 40px 28px 30px 28px;
            border-radius: 34px;
            box-shadow: 0 30px 60px rgba(15, 40, 70, 0.4),
                        0 0 40px rgba(255, 255, 255, 0.9),
                        inset 0 0 25px rgba(210, 195, 178, 0.7);
            width: 100%;
            max-width: 410px;
            text-align: center;
            position: relative;
            z-index: 2;
            margin: 20px;
        }

        /* Tiêu đề thương hiệu chuẩn gu quán */
        #shopTitle {
            color: #5c1818;
            font-size: 23px;
            font-weight: 800;
            margin-top: 5px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        #form-input {
            text-align: left;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #523931;
            display: block;
            margin-bottom: 6px;
        }

        /* Ô nhập liệu bọc lớp sương mờ băng giá tinh tế */
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border: 2.5px solid #a8c4db;
            border-radius: 14px;
            background: rgba(235, 244, 250, 0.95);
            font-size: 15px;
            color: #2c3e50;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.04);
        }

        input::placeholder {
            color: #94abc0;
        }

        input:focus {
            border-color: #a31d1d;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(163, 29, 29, 0.25), inset 0 2px 5px rgba(0,0,0,0.04);
        }

        /* Nút Tích Điểm ruy băng đỏ nhung rực rỡ */
        #btnSubmit {
            width: 100%;
            background: linear-gradient(135deg, #a31d1d 0%, #680d0d 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.45);
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #btnSubmit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 0, 0, 0.6);
        }

        /* Thanh menu 3 nút dưới cùng được tinh chỉnh sắc nét */
        .nav-menu {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 2px dashed #d5c2b4;
        }

        .nav-item {
            text-decoration: none;
            color: #4a3525;
            font-size: 12px;
            font-weight: 700;
            padding: 10px 4px;
            border-radius: 14px;
            background: #ffffff;
            border: 2px solid #e2d2c4;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }

        /* Nút Tích điểm đang active mang sắc thái kính băng giá sang trọng */
        .nav-item.active {
            background: linear-gradient(135deg, #d2e4f0 0%, #a8cde4 100%);
            color: #1a365d;
            border-color: #ffffff;
            box-shadow: 0 4px 12px rgba(40, 90, 130, 0.3), inset 0 0 8px rgba(255,255,255,0.8);
        }

        .nav-item:hover {
            transform: translateY(-2px);
        }

        .nav-icon {
            font-size: 18px;
        }

        #pointBox {
            display: none;
        }
    </style>

</head>
<body>
    <div class="card">
        <h2 id="shopTitle">⭐ Chào mừng Quốc Khánh: 02/09 ⭐</h2>
        <div id="form-input">
            <label>Tên khách hàng:</label>
            <input type="text" id="cusName" placeholder="Nhập tên của bạn">
            <label>Số điện thoại:</label>
            <input type="tel" id="cusPhone" placeholder="Nhập số điện thoại">
            <label>Mã tích điểm:</label>
            <input type="text" id="inputCode" placeholder="Nhập mã tích điểm">
            <button id="btnSubmit" onclick="handleVerify()">TÍCH ĐIỂM NGAY</button>
            <br><br><span style="color:#5d4037;font-weight:bold;">Zalo Đặt Trước: 0968.97.37.87</span>
        </div>
        <div id="pointBox" style="display:none;">
            <span id="currentPoints">0</span>
        </div> 
        <div id="result"></div>        
        <div class="nav-menu">
            <a href="index.html" class="nav-item active"><i>⭐</i> Tích điểm</a>
            <a href="danhsach.html" class="nav-item"><i>📜</i> Danh sách</a>
            <a href="doi-qua.html?from=webs" class="nav-item"><i>🎁</i> Xem quà</a>
        </div>
        <br><br><span style="color:#007b16;font-weight:bold;">15 điểm = 1 ly hay dùng</span>
        <br><span style="color:#990900;font-weight:bold;">Quét mã đổi điểm tại quầy</span>
    </div>

<script src="config.js"></script> 
<script>
    window.onload = function() {
        if (typeof CONFIG !== 'undefined' && CONFIG.SHOP_NAME) {
            document.getElementById('shopTitle').innerText = "☕ " + CONFIG.SHOP_NAME;
        }
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromURL = urlParams.get('code');
        const savedName = localStorage.getItem('didi_customer_name');
        const savedPhone = localStorage.getItem('didi_customer_phone');
        
        if (savedName) document.getElementById('cusName').value = savedName;
        if (savedPhone) document.getElementById('cusPhone').value = savedPhone;
        if (codeFromURL) document.getElementById('inputCode').value = codeFromURL.toUpperCase();
        
        if (codeFromURL && savedName && savedPhone) {
            setTimeout(handleVerify, 500);
        }
    };

    function handleVerify() {
        const name = document.getElementById('cusName').value.trim();
        const phone = document.getElementById('cusPhone').value.trim();
        const code = document.getElementById('inputCode').value.trim().toUpperCase();
        const resultDiv = document.getElementById('result');
        const btnSubmit = document.getElementById('btnSubmit');

        if (!name || !phone || !code) {
            resultDiv.innerHTML = "<div class='error'>❌ Vui lòng nhập đầy đủ thông tin!</div>";
            return;
        }

        const shopPhone = "0968973787";
        const cleanPhone = phone.replace(/\D/g, ""); 
        if (cleanPhone === shopPhone) {
            resultDiv.innerHTML = "<div class='error'>❌ Vui lòng nhập lại SĐT của bạn, Đây là số cửa hàng không thể tích điểm!</div>";
            return;
        }

        btnSubmit.disabled = true; 
        btnSubmit.innerHTML = "⌛ Đang tích điểm..."; 
        resultDiv.innerHTML = ""; 
        
        localStorage.setItem('didi_customer_name', name);
        localStorage.setItem('didi_customer_phone', phone);
        
        // --- LOGIC CẬP NHẬT ĐIỂM THEO MÃ ---
        let pointsToAdd = (CONFIG.POINTS_PER_CODE) ? parseFloat(CONFIG.POINTS_PER_CODE) : 1;

        if (code.startsWith("TA")) {
            pointsToAdd = pointsToAdd - 0;
        } else if (code.startsWith("SC")) {
            pointsToAdd = pointsToAdd + 0.25;
        }
        // ------------------------------------

        const safetyTimeout = setTimeout(function() {
            if (btnSubmit.disabled) {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "TÍCH ĐIỂM NGAY";
                resultDiv.innerHTML = "<div class='error'>❌ Kết nối chậm, vui lòng thử lại!</div>";
            }
        }, 20000);

        window.googleCallback = function(resData) {
            clearTimeout(safetyTimeout);
            btnSubmit.disabled = false;
            btnSubmit.innerText = "TÍCH ĐIỂM NGAY";

            if (resData.status === "SUCCESS") {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                const now = new Date();
                const timeStr = now.toLocaleDateString('vi-VN') + " " + now.toLocaleTimeString('vi-VN');
                resultDiv.innerHTML = `
                    <div class="success-box">
                        <div>✅ TÍCH ĐIỂM THÀNH CÔNG!</div>
                        <span class="time">Thời gian: ${timeStr}</span>
                        <span class="points-info">Số điểm hiện tại: <span>${resData.points}</span></span>
                    </div>
                `;  
                document.getElementById('inputCode').value = ""; 

                // Kiểm tra kết quả VIP trả về từ cột VIP (resData.vip) thay vì check điểm
                if (resData.vip && resData.vip.toUpperCase() === "VIP") {
                    setTimeout(function() {
                        alert("🎉 Chúc mừng bạn đã được nâng cấp lên thành viên VIP! Ưu đãi đặc quyền: Dùng 14 điểm để đổi 1 ly bất kỳ.");
                    }, 400);
                }

                if (resData.isTop1 === true) {
                    setTimeout(function() {
                        alert("Chúc mừng! Quý khách đang có số điểm tích lũy cao nhất: " + resData.points + " điểm.");
                    }, 800);
                }
            } 
            else if (resData.status === "USED") {
                resultDiv.innerHTML = `
                    <div class="success-box" style="background-color: #fff3e0; border-color: #ff9800; color: #e65100;">
                        <div>⚠️ Mã này đã được sử dụng.</div>
                        <span class="points-info">Số điểm hiện tại: <span>${resData.points}</span></span>
                    </div>
                `;
            } 
            else if (resData.status === "ERROR" && resData.message && resData.message.includes("không tồn tại")) {
                resultDiv.innerHTML = "<div class='error'>❌ Mã không tồn tại!</div>";
            }
            else {
                resultDiv.innerHTML = "<div class='error'>❌ " + (resData.message || "Lỗi hệ thống!") + "</div>";
            }
            
            const oldScript = document.getElementById('api-call');
            if (oldScript) oldScript.remove();
        };

        const scriptTag = document.createElement("script");
        scriptTag.id = "api-call";
        scriptTag.src = `${CONFIG.SCRIPT_URL}?action=tich_diem&code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&add_points=${pointsToAdd}&callback=googleCallback&t=${new Date().getTime()}`;        
        
        scriptTag.onerror = function() {
            clearTimeout(safetyTimeout);
            resultDiv.innerHTML = "<div class='error'>❌ Lỗi kết nối máy chủ!</div>";
            btnSubmit.disabled = false;
            btnSubmit.innerText = "TÍCH ĐIỂM NGAY";
            const oldScript = document.getElementById('api-call');
            if (oldScript) oldScript.remove();
        };
        document.body.appendChild(scriptTag);
    }
</script>
</body>
</html>
