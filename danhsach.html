<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Vàng - Di Di Coffee</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* GIỮ NGUYÊN STYLE CARD CỦA BẠN */
        .table-header {
            display: flex;
            background: #d32f2f;
            color: white;
            font-weight: bold;
            padding: 10px 0;
            font-size: 0.7em; /* Font nhỏ hơn 2 số theo ý bạn */
            text-transform: uppercase;
            border-radius: 12px 12px 0 0;
        }

        .col-stt { width: 12%; text-align: center; }
        .col-name { width: 40%; text-align: left; padding-left: 5px; }
        .col-phone { width: 28%; text-align: center; }
        .col-pts { width: 20%; text-align: right; padding-right: 12px; }

        .leaderboard-wrapper {
            background: #fff;
            border-radius: 15px;
            margin: 10px;
            border: 2px solid #d32f2f;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* VÙNG CUỘN THỦ CÔNG - TỐI ƯU CHO ĐIỆN THOẠI */
        .scroll-container {
            max-height: 450px; /* Tăng chiều cao để hiện nhiều khách hơn */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .row-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.75em; /* Font nhỏ */
            align-items: center;
        }

        /* HUY HIỆU NHỎ LẠI */
        .medal { font-size: 0.85em; margin-right: 3px; }
        
        .top-1 { background: #fff9e6 !important; font-weight: bold; color: #d32f2f; border-left: 3px solid #ffd700; }
        .top-2 { background: #f8f9fa !important; border-left: 3px solid #c0c0c0; }
        .top-3 { background: #fffdf9 !important; border-left: 3px solid #cd7f32; }

        /* Ẩn scrollbar để đẹp hơn */
        .scroll-container::-webkit-scrollbar { width: 0; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="color: #d32f2f; margin: 5px 0; font-size: 1em;">🏆 BẢNG VÀNG TÍCH ĐIỂM</h3>

        <div class="leaderboard-wrapper {">
            <div class="table-header">
                <div class="col-stt">STT</div>
                <div class="col-name">TÊN KHÁCH</div>
                <div class="col-phone">SĐT</div>
                <div class="col-pts">ĐIỂM</div>
            </div>
            <div class="scroll-container">
                <div id="leaderboardData">
                    <div style="text-align:center; padding: 40px; color: #999;">Đang tải danh sách...</div>
                </div>
            </div>
        </div>
        
        <p style="font-size: 0.7em; color: #888; font-style: italic;">* Vuốt lên/xuống để xem toàn bộ danh sách</p>

        <div class="nav-menu">
            <a href="index.html" class="nav-item"><i>⭐</i> Tích điểm</a>
            <a href="danhsach.html" class="nav-item active"><i>📜</i> Danh sách</a>
            <a href="doi-qua.html?from=web" class="nav-item"><i>🎁</i> Đổi quà</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ĐƯA HÀM CALLBACK RA NGOÀI ĐỂ TRÌNH DUYỆT NHẬN DIỆN ĐÚNG KHI CÓ DATA TRẢ VỀ
        window.leaderboardCB = function(res) {
            if (res.status === "SUCCESS") {
                let html = "";
                res.data.forEach((item, index) => {
                    let topClass = (index === 0) ? "top-1" : (index === 1 ? "top-2" : (index === 2 ? "top-3" : ""));
                    let medal = (index === 0) ? "🥇 " : (index === 1 ? "🥈 " : (index === 2 ? "🥉 " : ""));
                    
                    html += `<div class="row-item ${topClass}">
                                <div class="col-stt">${index + 1}</div>
                                <div class="col-name"><span class="medal">${medal}</span>${item.name}</div>
                                <div class="col-phone">${item.phone}</div>
                                <div class="col-pts">${item.points}đ</div>
                            </div>`;
                });
                document.getElementById('leaderboardData').innerHTML = html || "<div style='text-align:center; padding:20px;'>Chưa có dữ liệu</div>";
            }
            if (document.getElementById('api-list')) document.getElementById('api-list').remove();
        };

        function loadData() {
            const scriptTag = document.createElement("script");
            scriptTag.id = "api-list";
            scriptTag.src = `${CONFIG.SCRIPT_URL}?action=get_leaderboard&callback=leaderboardCB&t=${new Date().getTime()}`;
            document.body.appendChild(scriptTag);
        }

        window.onload = loadData;
    </script>
</body>
</html>
