<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Vàng - Di Di Coffee</title>
    <link rel="stylesheet" href="style.css">
    <style>
      /* --- HIỆU ỨNG TÔN VINH VIP TOÀN DÒNG + VIỀN TÍM CHẠY QUANH --- */
    .row-vip {
        background: linear-gradient(135deg, #fffdf0 0%, #fff3cd 50%, #fff8e1 100%) !important;
        position: relative;
        /* Viền tím nổi bật xung quanh toàn bộ dòng */
        border: 0.2px solid #8e44ad !important;
        border-radius: 42px; /* Bo tròn góc khung của dòng nhìn cho mềm mại, sang */
        margin: 4px 0; /* Tạo khoảng cách nhẹ giữa các dòng VIP để thấy rõ khung viền */
        box-shadow: 0 4px 10px rgba(142, 68, 173, 0.25), inset 0 0 10px rgba(255, 193, 7, 0.15);
    }
    
    /* Hiệu ứng quét ánh kim vàng lấp lánh bên trong dòng */
    .row-vip::after {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,215,0,0.25), transparent);
        pointer-events: none;
        animation: vip-shimmer 3s infinite;
        border-radius: 8px;
    }

    @keyframes vip-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
        /* 1. Tạo lớp nền lấp lánh (phía trên body) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            
            background-image: 
                radial-gradient(1px 1px at 25px 35px, white, rgba(255, 255, 255, 0)),
                radial-gradient(1.5px 1.5px at 60px 80px, white, rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 125px 20px, white, rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 150px 150px, yellow, rgba(255, 255, 0, 0)),
                radial-gradient(1.5px 1.5px at 190px 70px, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
            background-size: 200px 200px;
            
            animation: twinkling 4s infinite alternate ease-in-out;
        }

        @keyframes twinkling {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        #btnSubmit {
            animation: pulse-button 1s infinite;
        }

        @keyframes pulse-button {
            0% { box-shadow: 0 0 0 0 rgba(218, 37, 29, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(218, 37, 29, 0); }
            100% { box-shadow: 0 0 0 0 rgba(218, 37, 29, 0); }
        }

        body {
            background-color: #da251d !important; 
            background-image: radial-gradient(circle, #ff0000 0%, #750000 100%) !important;
            position: relative;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body::before {
            content: "★";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80vw;
            color: rgba(255, 255, 0, 0.15);
            z-index: -1;
            font-family: Arial, sans-serif;
        }

        .card {
            border: 1px solid #ffde00 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
            background-color: rgba(255, 255, 255, 0.5) !important; 
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        #shopTitle {
            color: #da251d !important;
        }

        #btnSubmit {
            background: linear-gradient(135deg, #da251d 0%, #ffde00 100%) !important;
            color: #fff !important;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 15px rgba(218, 37, 29, 0.4);
        }

        /* --- PHẦN CẬP NHẬT: BĂNG RÔN VÀ NGÔI SAO --- */
        .banner-corner {
            position: fixed;
            top: 0;
            width: 250px;
            height: 60px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffde00;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-radius: 40px; 
        }

        /* Tạo ngôi sao vàng dưới băng rôn */
        .banner-corner::after {
            content: "★";
            position: absolute;
            bottom: -35px; /* Vị trí dưới băng rôn */
            font-size: 30px;
            color: #ffde00;
            text-shadow: 0 0 10px rgba(255, 222, 0, 0.8);
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        .banner-left {
            left: -60px;
            top: 25px;
            background: linear-gradient(135deg, #a50000 0%, #da251d 100%);
            transform: rotate(-30deg);
            border: 2px solid #ffde00;
        }

        /* Chỉnh ngôi sao bên trái lệch một chút cho cân đối theo độ xoay */
        .banner-left::after {
            right: 108px;
        }

        .banner-right {
            right: -60px;
            top: 25px;
            background: linear-gradient(-135deg, #a50000 0%, #da251d 100%);
            transform: rotate(30deg);
            border: 2px solid #ffde00;
        }

        /* Chỉnh ngôi sao bên phải lệch một chút cho cân đối theo độ xoay */
        .banner-right::after {
            left: 108px;
        }

        .banner-date {
            font-size: 18px;
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .banner-text {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 2px 0 0 0;
            color: #fff;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .banner-corner {
                width: 200px;
                height: 50px;
            }
            .banner-date { font-size: 14px; }
            .banner-text { font-size: 8px; }
            .banner-left { left: -50px; }
            .banner-right { right: -50px; }
            .banner-corner::after { font-size: 24px; bottom: -30px; }
        }
        /* --- PHẦN CẬP NHẬT: NGÔI SAO ĐỨNG THẲNG --- */
        .banner-corner::after {
            content: "★";
            position: absolute;
            bottom: -35px;
            font-size: 30px;
            color: #ffde00;
            text-shadow: 0 0 10px rgba(255, 222, 0, 0.8);
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
            /* Mặc định cho ngôi sao đứng thẳng */
            display: block; 
        }

        .banner-left::after {
            right: 108px;
            /* Băng rôn xoay -30deg thì ta xoay ngược lại 30deg để ngôi sao đứng thẳng */
            transform: rotate(30deg); 
        }

        .banner-right::after {
            left: 108px;
            /* Băng rôn xoay 30deg thì ta xoay ngược lại -30deg để ngôi sao đứng thẳng */
            transform: rotate(-30deg);
        }
    /*end 2-9 -----------------------------------------------------------------------------------*/
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #eee;
        }
        .card {
            width: 100% !important;
            max-width: 480px;
            margin: 0 auto !important;
            padding: 10px 5px !important;
            box-sizing: border-box;
            background: #fff;
        }
        .table-header {
            display: flex;
            background: #d32f2f;
            color: white;
            font-weight: bold;
            padding: 10px 0;
            font-size: 0.7em; 
            text-transform: uppercase;
            border-radius: 12px 12px 0 0;
        }
        .col-stt { width: 10%; text-align: center; }
        .col-name { width: 44%; text-align: left; padding-left: 8px; }
        .col-phone { width: 28%; text-align: center; }
        .col-pts { width: 18%; text-align: right; padding-right: 12px; }

        .leaderboard-wrapper {
            background: #fff;
            border-radius: 15px;
            margin: 10px 2px; 
            border: 2px solid #d32f2f;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: calc(100% - 4px); 
            box-sizing: border-box;
        }
        .scroll-container {
            max-height: 450px; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .row-item {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.75em; 
            align-items: center;
        }
        .medal { font-size: 0.85em; margin-right: 2px; }
        .top-1 { background: #fff9e6 !important; font-weight: bold; color: #d32f2f; border-left: 2px solid #ffd700; }
        .top-2 { background: #f8f9fa !important; border-left: 2px solid #c0c0c0; }
        .top-3 { background: #fffdf9 !important; border-left: 2px solid #cd7f32; }
        .scroll-container::-webkit-scrollbar { width: 0; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="color: #d32f2f; margin: 5px 0; font-size: 1em;">🏆 BẢNG VÀNG TÍCH ĐIỂM</h3>

        <div class="leaderboard-wrapper">
            <div class="table-header">
                <div class="col-stt">STT</div>
                <div class="col-name">TÊN KHÁCH</div>
                <div class="col-phone">SĐT</div>
                <div class="col-pts">ĐIỂM</div>
            </div>
            <div class="scroll-container">
                <div id="leaderboardData">
                    <div style="text-align:center; padding: 40px; color: #999;">Đang tải danh sách...</div>
                </div>
            </div>
        </div>
        
        <p style="font-size: 0.7em; color: #888; font-style: italic;">* Vuốt lên/xuống để xem toàn bộ danh sách</p>

        <div class="nav-menu">
            <a href="index.html" class="nav-item"><i>⭐</i> Tích điểm</a>
            <a href="danhsach.html" class="nav-item active" id="btnDanhSach"><i>📜</i> Danh sách</a>
            <a href="doi-qua.html?from=webs" class="nav-item"><i>🎁</i> Xem quà</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        window.leaderboardCB = function(res) {
            if (res.status === "SUCCESS") {
                let html = "";
                res.data.forEach((item, index) => {
                    // Kiểm tra cột VIP từ Google Sheets trả về
                    let isVip = (item.vip === "VIP" || item.isVip === "VIP");
                    
                    // Xác định thứ hạng và class
                    let topClass = (index === 0) ? "top-1" : (index === 1 ? "top-2" : (index === 2 ? "top-3" : ""));
                    let medal = (index === 0) ? "🥇 " : (index === 1 ? "🥈 " : (index === 2 ? "🥉 " : ""));
                    
                    let finalClass = topClass + (isVip ? " row-vip" : "");

                    // NẾU LÀ VIP: Thay số thứ tự thành vương miện 👑, ngược lại hiện số thứ tự (index + 1)
                    let sttDisplay = isVip ? "👑" : (index + 1);

                    html += `<div class="row-item ${finalClass}">
                                <div class="col-stt" ${isVip ? 'style="font-size: 1.1em;"' : ""}>${sttDisplay}</div>
                                <div class="col-name"><span class="medal">${medal}</span>${item.name}</div>
                                <div class="col-phone">${item.phone}</div>
                                <div class="col-pts">${item.points}đ</div>
                            </div>`;
                });
                document.getElementById('leaderboardData').innerHTML = html || "<div style='text-align:center; padding:20px;'>Chưa có dữ liệu</div>";
            }
            if (document.getElementById('api-list')) document.getElementById('api-list').remove();
        };

        function loadData() {
            // 1. Kiểm tra xem trên Link URL có truyền số điện thoại không trước
            const urlParams = new URLSearchParams(window.location.search);
            let viewerPhone = urlParams.get('phone') || "";
            
            // 2. Nếu trên link không có, lấy chính xác từ khóa 'didi_customer_phone' trong máy khách ra
            if (!viewerPhone) {
                viewerPhone = localStorage.getItem('didi_customer_phone') || "";
            }

            const scriptTag = document.createElement("script");
            scriptTag.id = "api-list";
            scriptTag.src = `${CONFIG.SCRIPT_URL}?action=get_leaderboard&callback=leaderboardCB&viewer=${encodeURIComponent(viewerPhone)}&t=${new Date().getTime()}`;
            document.body.appendChild(scriptTag);
        }

        // TỰ ĐỘNG CHÈN ĐUÔI SĐT VÀO NÚT MENU DANH SÁCH ĐỂ TẠO LINK CHUẨN KHÔNG BỊ ẨN DANH
        function updateMenuLink() {
            let sdtLuuTrongMay = localStorage.getItem('didi_customer_phone') || "";
            if (sdtLuuTrongMay) {
                const btnDanhSach = document.getElementById('btnDanhSach');
                if (btnDanhSach) {
                    btnDanhSach.href = `danhsach.html?phone=${encodeURIComponent(sdtLuuTrongMay)}`;
                }
            }
        }

        window.onload = function() {
            loadData();
            updateMenuLink();
        };
    </script>
</body>
</html>
