<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Di Di Coffee - Đổi Thưởng</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script> 
    <style>
        /* PHẦN CẬP NHẬT GIAO DIỆN: THÊM NGÔI SAO LẤP LÁNH */

        /* 1. Tạo lớp nền lấp lánh (phía trên body) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            
            background-image: 
                radial-gradient(1px 1px at 25px 35px, white, rgba(255, 255, 255, 0)),
                radial-gradient(1.5px 1.5px at 60px 80px, white, rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 125px 20px, white, rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 150px 150px, yellow, rgba(255, 255, 0, 0)),
                radial-gradient(1.5px 1.5px at 190px 70px, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
            background-size: 200px 200px;
            
            animation: twinkling 4s infinite alternate ease-in-out;
        }

        @keyframes twinkling {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        #btnSubmit {
            animation: pulse-button 1s infinite;
        }

        @keyframes pulse-button {
            0% { box-shadow: 0 0 0 0 rgba(218, 37, 29, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(218, 37, 29, 0); }
            100% { box-shadow: 0 0 0 0 rgba(218, 37, 29, 0); }
        }

        /* Khối thông báo tạm ngưng đổi trực tuyến */
        .paused-notice-box {
            margin: 16px 6px 20px;
            padding: 20px 16px;
            border-radius: 16px;
            background: linear-gradient(145deg, #fffdf5 0%, #fff3cd 60%, #ffe8a3 100%);
            border: 1.5px solid #f59e0b;
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.85);
            text-align: center;
        }

        .paused-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            background: #b91c1c;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .paused-icon {
            font-size: 34px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .paused-message {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            color: #7c2d12;
            margin: 0 0 12px;
        }

        .paused-sub {
            font-size: 12.5px;
            line-height: 1.45;
            color: #92400e;
            background: rgba(255, 255, 255, 0.72);
            border: 1px dashed rgba(217, 119, 6, 0.45);
            border-radius: 10px;
            padding: 8px 10px;
        }
    </style>
</head>
<body>
    <div class="card"> 
        <h2 id="shopTitle">☕ DI DI COFFEE</h2>

        <div class="paused-notice-box">
            <div class="paused-badge">Thông báo</div>
            <div class="paused-icon">⏸️💳</div>
            <p class="paused-message">Tạm thời ngưng hoạt động vui lòng đổi tại quầy hoặc đổi từ thẻ thành viên</p>
            <div class="paused-sub">Cảm ơn bạn đã đồng hành cùng Di Di Coffee!</div>
        </div>

        <div class="nav-menu">
            <a href="index.html" class="nav-item"><i>⭐</i> Tích điểm</a>
            <a href="danhsach.html" class="nav-item"><i>📜</i> Danh sách</a>
            <a href="doi-qua.html?from=webs" class="nav-item active"><i>🎁</i> Xem quà</a>
        </div>
    </div>

<script>
    const scriptURL = CONFIG.SCRIPT_URL;
    const minPoints = CONFIG.REDEEM_POINTS;
    let isProcessing = false;
    let fromWeb = false; 

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        fromWeb = urlParams.get('from') === 'webs';
        const phoneFromUrl = urlParams.get('phone');
        const savedPhone = localStorage.getItem('didi_customer_phone') || localStorage.getItem('userPhone');
        
        if (fromWeb) {
            const formEl = document.getElementById('form-input');
            if (formEl) formEl.style.display = "none";
        }

        const finalPhone = phoneFromUrl || savedPhone;
        if (finalPhone) {
            const phoneEl = document.getElementById('phone');
            if (phoneEl) phoneEl.value = finalPhone;
            autoProcess(finalPhone); 
        }
    };

    async function autoProcess(phone) {
        isProcessing = true;
        const display = document.getElementById('pointDisplay');
        if (!display) {
            isProcessing = false;
            return;
        }
        display.innerHTML = "⏳ Đang kiểm tra điểm...</br></br>";
        try {
            const res = await fetch(`${scriptURL}?action=get_points_new&phone=${phone}`);
            const data = await res.json(); 
            
            let currentPoints = parseFloat(data.points) || 0;
            let customerName = data.name || "Khách hàng";
            let guUongCuaKhach = data.gu_uong || "1 LY MIỄN PHÍ"; 
            
            display.innerHTML = `<div style='text-align:center;'>Chào <b>${customerName}</b>! Bạn có: <b>${currentPoints}</b> điểm</div></br>`;

            if (currentPoints >= minPoints) {
                if (fromWeb) {
                    document.getElementById('status').innerHTML = `
                        <div class="success-box" style="border: 1px solid #2e7d32; background-color: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="color: #2e7d32; font-weight: bold; font-size: 16px; margin-bottom: 10px;">🎉 QUÀ HIỆN TẠI CỦA BẠN LÀ: 🎉</div>
                            <div style="margin: 15px 0;">
                                <strong style="font-size: 20px; color: #da251d; text-transform: uppercase;">${guUongCuaKhach}</strong>
                            </div>
                            <div style="font-size: 13px; color: #37474f; text-align: left; line-height: 1.5; margin-top: 10px;">
                                ⚠️ Vui lòng đến trực tiếp quầy Di Di Coffee và quét mã QR chính thức để kích hoạt đổi quà thực tế.
                            </div>
                        </div>
                    `;
                    isProcessing = false;
                } else {
                    handleRedeem();
                }
            } else {
                isProcessing = false;
                if (!fromWeb) {
                    const btnEl = document.getElementById('btnRedeem');
                    if (btnEl) btnEl.innerText = "CHƯA ĐỦ ĐIỂM";
                } else {
                    document.getElementById('status').innerHTML = `
                        <div class="success-box" style="border: 1px solid #757575; background-color: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="color: #616161; font-weight: bold;">CHƯA ĐỦ ĐIỂM ĐỔI QUÀ</div>
                            <div style="margin: 15px 0;">
                                <strong style="font-size: 16px; color: #757575;">BẠN THIẾU ${(minPoints - currentPoints)} ĐIỂM</strong>
                            </div>
                            <span class="time" style="color: #757575; font-size: 13px;">Tích cực uống để đổi đúng món gu ${guUongCuaKhach.toLowerCase()} thương hiệu của bạn nhé!</span>
                        </div>
                    `;
                }
            }
        } catch (e) { 
            console.error(e);
            display.innerHTML = "❌ Không tìm thấy thông tin";
            isProcessing = false; 
        }
    }

    function checkPointRealtime() {
        if (isProcessing) return;
        const phoneInput = document.getElementById('phone');
        const btn = document.getElementById('btnRedeem');
        const display = document.getElementById('pointDisplay');
        if (!phoneInput || !btn || !display) return;
        const phone = phoneInput.value.trim();

        if (phone.length >= 10) {
            fetch(`${scriptURL}?action=get_points_new&phone=${phone}`)
                .then(res => res.json())
                .then(data => {
                    let cp = parseFloat(data.points) || 0;
                    let name = data.name || "Khách hàng";
                    display.innerHTML = `<div style='text-align:center;'>Chào <b>${name}</b>! Bạn có: <b>${cp}</b> điểm</div>`;
                    
                    btn.disabled = cp < minPoints;
                    btn.innerText = cp < minPoints ? "CHƯA ĐỦ ĐIỂM" : "XÁC NHẬN ĐỔI QUÀ";
                })
                .catch(err => {
                    display.innerHTML = "SĐT chưa có điểm tích lũy";
                });
        }
    }

    function handleRedeem() {
        const phoneInput = document.getElementById('phone');
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('btnRedeem');
        if (!phoneInput || !statusDiv || !btn) return;
        const phone = phoneInput.value.trim();
        
        isProcessing = true;
        btn.disabled = true;
        btn.innerText = "⏳ ĐANG XỬ LÝ...";

        fetch(`${scriptURL}?action=doi_thuong&phone=${phone}&points=${minPoints}`)
        .then(res => res.json())
        .then(result => {
            if (result.status === "SUCCESS") {
                const now = new Date();
                
                statusDiv.innerHTML = `
                    <div class="success-box">
                        <div>✅ ĐỔI THÀNH CÔNG!</div>
                        <div style="margin: 15px 0;">
                            <strong style="font-size: 18px; color: #da251d;">${result.gift_name.toUpperCase()}</strong>
                        </div>
                        <span class="time">Thời gian: ${now.toLocaleString('vi-VN')}</span>
                        <button class="btn-confirm" onclick="window.location.href='doi-qua.html'">TIẾP TỤC ĐỔI</button>
                    </div>
                `;
                document.getElementById('form-input').style.display = "none";
                document.getElementById('pointDisplay').style.display = "none";
            } else {
                alert("Lỗi: " + result.status);
                isProcessing = false;
                btn.disabled = false;
                btn.innerText = "XÁC NHẬN ĐỔI QUÀ";
            }
        });
    }
</script>
</body>
</html>
