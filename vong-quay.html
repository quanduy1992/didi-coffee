<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>DI DI COFFEE - Vòng Quay May Mắn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" async></script>
    <style>
        #wheel-container {
            position: relative;
            width: 300px;
            margin: 20px auto;
            z-index: 10 !important;
        }
        #wheel {
            width: 100%;
            height: auto;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            display: block;
        }
        #pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 40px;
            background: #d32f2f;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 11;
            border-bottom: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="card"> 
        <h2 id="shopTitle">🎡 VÒNG QUAY DI DI</h2>
        <p id="sub-title" style="color: #8d6e63; font-size: 14px; margin-top: -10px;">Đang tải cấu hình...</p>
        
        <div id="wheel-container">
            <div id="pointer"></div>
            <canvas id="wheel" width="300" height="300"></canvas>
        </div>

        <div id="pointDisplay" style="text-align: center; margin: 10px 0; font-weight: bold;"></div>

        <div class="controls" id="form-input">
            <label>Số điện thoại:</label>
            <input type="tel" id="phone" placeholder="Nhập số điện thoại để quay" oninput="checkPointRealtime()" style="width:100%; padding:10px; margin:10px 0;">
            <button id="spinBtn" onclick="checkAndSpin()" disabled style="width: 100%; display: none;">QUAY NGAY</button>
            <button id="testBtn" onclick="testSpin()" style="width: 100%; margin-top: 8px; background-color: #795548; color: white;">QUAY THỬ (KHÔNG TRỪ ĐIỂM)</button>
        </div>

        <div id="result"></div>

        <div class="nav-menu">
            <a href="index.html" class="nav-item"><i>⭐</i> Tích điểm</a>
            <a href="doi-qua.html?from=webs" class="nav-item"><i>🎁</i> Đổi quà</a>
            <a href="vong-quay.html" class="nav-item active"><i>🎡</i> Quay thưởng</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const scriptURL = CONFIG.SCRIPT_URL;
        const spinPoints = CONFIG.SPIN_POINTS || 200;
        let isProcessing = false;
        let currentClientPoints = 0; 

        const GIFTS = ["Tặng 20 ly", "-100 điểm", "Tặng 50 ly", "Giỏ quà tết"];
        const COLORS = ["#d32f2f", "#f1c40f", "#d32f2f", "#f1c40f"];
        const GIFT_DATA = [
            { name: "Tặng 20 ly", weight: 0 }, 
            { name: "-100 điểm", weight: 0 }, 
            { name: "Tặng 50 ly", weight: 0 }, 
            { name: "Giỏ quà tết", weight: 100 }
        ];

        let currentRotation = 0;

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const arc = (Math.PI * 2) / GIFTS.length;
            ctx.clearRect(0, 0, 300, 300);
            ctx.save();
            ctx.translate(150, 150);
            ctx.rotate(-Math.PI / 2); 
            ctx.translate(-150, -150);
            GIFTS.forEach((gift, i) => {
                ctx.beginPath();
                ctx.fillStyle = COLORS[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 145, i * arc, (i + 1) * arc);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.save();
                ctx.fillStyle = COLORS[i] === "#f1c40f" ? "#d32f2f" : "white";
                ctx.font = "bold 13px Arial";
                ctx.translate(150, 150);
                ctx.rotate(i * arc + arc / 2);
                ctx.textAlign = "right";
                ctx.fillText(gift, 130, 5);
                ctx.restore();
            });
            ctx.restore();
            ctx.beginPath();
            ctx.arc(150, 150, 15, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.stroke();
        }

        window.onload = function() {
            drawWheel();
            if (typeof CONFIG !== 'undefined' && CONFIG.SHOP_NAME) {
                document.getElementById('shopTitle').innerText = "🎡 " + CONFIG.SHOP_NAME;
                document.getElementById('sub-title').innerText = `Đổi ${spinPoints} điểm còn lại = 1 lượt quay`;
            }
            const savedPhone = localStorage.getItem('didi_customer_phone') || localStorage.getItem('userPhone');
            if (savedPhone) {
                document.getElementById('phone').value = savedPhone;
                checkPointRealtime();
            }
        };

        function checkPointRealtime() {
            if (isProcessing) return;
            const phone = document.getElementById('phone').value.trim();
            const btn = document.getElementById('spinBtn');
            const display = document.getElementById('pointDisplay');

            if (phone.length >= 10) {
                display.innerHTML = "⏳ Đang kiểm tra điểm...";
                fetch(`${scriptURL}?action=get_points_new&phone=${phone}`)
                    .then(res => res.json())
                    .then(data => {
                        currentClientPoints = parseFloat(data.points) || 0;
                        let name = data.name || "Khách hàng";
                        display.innerHTML = `Chào <b>${name}</b>! Bạn có: <b>${currentClientPoints}</b> điểm`;
                        
                        btn.disabled = currentClientPoints < spinPoints;
                        btn.innerText = currentClientPoints < spinPoints ? "CHƯA ĐỦ ĐIỂM" : "QUAY NGAY";
                        if (currentClientPoints >= spinPoints) {
                            localStorage.setItem('didi_customer_phone', phone);
                        }
                    })
                    .catch(err => {
                        display.innerHTML = "❌ SĐT chưa có điểm tích lũy";
                        btn.disabled = true;
                        btn.innerText = "QUAY NGAY";
                    });
            } else {
                display.innerHTML = "";
                btn.disabled = true;
                btn.innerText = "QUAY NGAY";
            }
        }

        // HÀM QUAY THẬT (TRỪ ĐIỂM, LƯU LÊN SHEET)
        function checkAndSpin() {
            const phone = document.getElementById('phone').value.trim().replace(/[^0-9]/g, "");
            const btn = document.getElementById('spinBtn');
            const resDiv = document.getElementById('result');

            if (phone.length < 10) { 
                resDiv.innerHTML = "<div class='error'>❌ Vui lòng nhập đúng SĐT!</div>";
                return; 
            }

            if (currentClientPoints < spinPoints) {
                resDiv.innerHTML = `<div class='error'>❌ Không đủ điểm! (Hiện có: ${currentClientPoints}/${spinPoints})</div>`;
                btn.disabled = true;
                btn.innerText = "CHƯA ĐỦ ĐIỂM";
                return;
            }

            isProcessing = true;
            btn.disabled = true;
            document.getElementById('testBtn').disabled = true;
            btn.innerText = "🎡 ĐANG QUAY...";
            resDiv.innerHTML = "";

            const totalWeight = GIFT_DATA.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            for (let i = 0; i < GIFT_DATA.length; i++) {
                if (random < GIFT_DATA[i].weight) { selectedIndex = i; break; }
                random -= GIFT_DATA[i].weight;
            }
            const giftName = GIFT_DATA[selectedIndex].name;

            const arc = 360 / GIFTS.length;
            const targetDegree = 360 - (selectedIndex * arc + arc / 2);
            currentRotation += 1440 + (targetDegree - (currentRotation % 360) + 360) % 360;
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            // Gửi dữ liệu ngầm lên server
            fetch(`${scriptURL}?action=vong_quay&phone=${phone}&gift=${encodeURIComponent(giftName)}&points=${spinPoints}`);

            currentClientPoints = Math.max(0, currentClientPoints - spinPoints);

            setTimeout(() => {
                const now = new Date();
                const timeStr = now.toLocaleDateString('vi-VN') + " " + now.toLocaleTimeString('vi-VN');

                resDiv.innerHTML = `
                    <div class="success-box">
                        <div>${giftName.includes('Chúc') ? '🍀' : '🎉'} ${giftName.toUpperCase()}</div>
                        <span class="time">Thời gian quay: ${timeStr}</span>
                        <span class="points-info">Số điểm còn lại: <span>${currentClientPoints}</span></span>
                    </div>
                `;
                
                if (!giftName.includes("Chúc") && !giftName.includes("-")) {
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }
                }

                document.getElementById('pointDisplay').innerHTML = `Số điểm còn lại: <b>${currentClientPoints}</b> điểm`;
                
                isProcessing = false;
                document.getElementById('testBtn').disabled = false;
                btn.disabled = currentClientPoints < spinPoints;
                btn.innerText = currentClientPoints < spinPoints ? "CHƯA ĐỦ ĐIỂM" : "QUAY NGAY";
            }, 4000);
        }

        // HÀM QUAY THỬ (KHÔNG CẦN NHẬP SĐT, KHÔNG TRỪ ĐIỂM, KHÔNG GỬI LÊN SHEET)
        function testSpin() {
            const resDiv = document.getElementById('result');
            const btn = document.getElementById('spinBtn');
            const testBtn = document.getElementById('testBtn');

            isProcessing = true;
            testBtn.disabled = true;
            btn.disabled = true;
            testBtn.innerText = "🎡 ĐANG QUAY THỬ...";
            resDiv.innerHTML = "";

            const totalWeight = GIFT_DATA.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            for (let i = 0; i < GIFT_DATA.length; i++) {
                if (random < GIFT_DATA[i].weight) { selectedIndex = i; break; }
                random -= GIFT_DATA[i].weight;
            }
            const giftName = GIFT_DATA[selectedIndex].name;

            const arc = 360 / GIFTS.length;
            const targetDegree = 360 - (selectedIndex * arc + arc / 2);
            currentRotation += 1440 + (targetDegree - (currentRotation % 360) + 360) % 360;
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                resDiv.innerHTML = `
                    <div class="success-box" style="border: 2px dashed #795548; background: #efebe9;">
                        <div style="color: #795548;">🧪 [QUAY THỬ - KHÔNG TÍNH THẬT]</div>
                        <div style="font-size: 18px; margin: 5px 0;">🎉 ${giftName.toUpperCase()}</div>
                        <span class="time">Đây là lượt quay thử nghiệm của bạn!</span>
                    </div>
                `;
                
                if (!giftName.includes("Chúc") && !giftName.includes("-")) {
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 50, spread: 50, origin: { y: 0.6 } });
                    }
                }

                isProcessing = false;
                testBtn.disabled = false;
                testBtn.innerText = "QUAY THỬ (KHÔNG TRỪ ĐIỂM)";
                btn.disabled = currentClientPoints < spinPoints;
            }, 4000);
        }
    </script>
</body>
</html>
