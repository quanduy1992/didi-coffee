<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DI DI COFFEE - Quét Tặng Quà Tết</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #1a0b0b;
      --card: #fffdf9;
      --primary: #8b1e1e;
      --gold: #b45309;
      --text: #2c1810;
      --muted: #7a6558;
      --border: #eddcc4;
      --ok-bg: #dcfce7;
      --ok-text: #14532d;
      --ok-border: #22c55e;
      --warn-bg: #fef3c7;
      --warn-text: #78350f;
      --warn-border: #f59e0b;
      --err-bg: #fee2e2;
      --err-text: #7f1d1d;
      --err-border: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6efe4;
      color: var(--text);
      padding-bottom: 16px;
    }

    /* Thanh trên gọn 1 hàng */
    .topbar {
      background: linear-gradient(135deg, #8b1e1e, #b91c1c);
      color: #fff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-title { font-weight: 800; font-size: 14px; }
    .top-actions { display: flex; gap: 6px; }
    .btn-top {
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.16);
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-top.active { background: #fde68a; color: var(--primary); border-color: #fde68a; }

    /* Khung chính: 1 màn hình đt thấy đủ Cam + Kết quả */
    .screen {
      max-width: 480px;
      margin: 8px auto 0;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Camera gọn vừa tầm nhìn */
    .cam-wrap {
      background: #2b0909;
      border-radius: 14px;
      overflow: hidden;
      min-height: 205px;
      max-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #reader { width: 100%; }
    #reader video { max-height: 245px; object-fit: cover; border-radius: 14px; }
    .cam-idle {
      text-align: center;
      color: #fff;
      padding: 14px;
    }
    .cam-idle p { margin: 4px 0 10px; font-size: 12px; opacity: 0.85; }
    .btn-cam-big {
      background: #fde68a;
      color: var(--primary);
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
    }

    /* Kết quả nổi bật ngay dưới cam */
    .result-box {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      transition: all 0.15s ease;
    }
    .result-box.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-text); }
    .result-box.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
    .result-box.err { background: var(--err-bg); border-color: var(--err-border); color: var(--err-text); }
    .result-box.load { background: #fef9c3; border-color: #eab308; color: #713f12; }

    .res-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .res-gift {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      margin: 2px 0 4px;
    }
    .res-sub {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      margin: 0;
    }

    /* Thanh thao tác phụ gọn 1 dòng */
    .mini-bar {
      display: flex;
      gap: 6px;
    }
    .mini-input {
      flex: 1;
      height: 36px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    .btn-sm {
      height: 36px;
      padding: 0 11px;
      border-radius: 9px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sm.ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Ngăn phụ ẩn mặc định (chỉ mở khi cần xem lịch sử / soi mã) */
    .drawer {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .drawer.open { display: block; }
    .log-list { list-style: none; padding: 0; margin: 6px 0 0; max-height: 160px; overflow-y: auto; }
    .log-item {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px dashed var(--border);
    }
    .log-item:last-child { border-bottom: none; }

    /* Modal Key */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; padding: 14px; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 380px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .form-group input { width: 100%; height: 38px; border: 1px solid #ccc; border-radius: 9px; padding: 0 10px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-title">🧧 <span id="shopNameTitle">DI DI COFFEE</span> • QUÀ TẾT</div>
    <div class="top-actions">
      <button class="btn-top" id="btnToggleCam">📷 Cam</button>
      <button class="btn-top" id="btnOpenConfig">🔑 Key</button>
    </div>
  </header>

  <main class="screen">
    <!-- 1. Camera -->
    <div class="cam-wrap">
      <div id="reader"></div>
      <div class="cam-idle" id="camPlaceholder">
        <div style="font-size: 28px;">🧧</div>
        <p>Bấm bật camera để quét thẻ nhận quà</p>
        <button class="btn-cam-big" id="btnStartCamCenter">Bật camera</button>
      </div>
    </div>

    <!-- 2. Kết quả hiện ngay dưới camera -->
    <div class="result-box" id="resultBox">
      <div class="res-top">
        <span id="resTag">CHỜ QUÉT</span>
        <span id="resTime">--:--:--</span>
      </div>
      <div class="res-gift" id="resGift">Đưa mã QR vào khung quét</div>
      <p class="res-sub" id="resSub">Tự kiểm tra trạng thái &amp; báo phần quà trên sheet KHACH.</p>
    </div>

    <!-- 3. Nhập tay nhỏ gọn 1 hàng + nút mở nhật ký -->
    <div class="mini-bar">
      <input type="text" id="manualCodeInput" class="mini-input" placeholder="Nhập KEY / SĐT..." />
      <button class="btn-sm" id="btnManualSubmit">Tặng</button>
      <button class="btn-sm ghost" id="btnToggleDrawer">📋 Nhật ký</button>
    </div>

    <!-- Nhật ký & soi trạng thái (ẩn sẵn cho gọn màn hình) -->
    <div class="drawer" id="drawerBox">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
        <strong>Lịch sử tặng trong ca</strong>
        <div style="display:flex; gap:6px;">
          <button class="btn-sm ghost" id="btnCheckStatusManual" style="height:28px; padding:0 8px; font-size:11px;">👁️ Chỉ soi mã trên</button>
          <button class="btn-sm ghost" id="btnClearHistory" style="height:28px; padding:0 8px; font-size:11px;">Xóa</button>
        </div>
      </div>
      <ul class="log-list" id="historyList">
        <li style="color: var(--muted);">Chưa có lượt nào.</li>
      </ul>
    </div>
  </main>

  <div class="modal-backdrop" id="configModal">
    <div class="modal">
      <h3 style="margin:0 0 10px;">🔑 Mã bảo mật quầy</h3>
      <div class="form-group">
        <label>Mã bảo mật (secret_key)</label>
        <input type="text" id="cfgSecretKey" placeholder="Nhập mã bảo mật..." />
      </div>
      <div class="form-group">
        <label>Chống quét trùng cùng thẻ (giây)</label>
        <input type="number" id="cfgCooldown" value="4" min="1" max="30" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button class="btn-sm ghost" id="btnCloseConfig">Đóng</button>
        <button class="btn-sm" id="btnSaveConfig">Lưu</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "didi_qr_scanner_cfg_v2";
    const CFG = (typeof CONFIG !== "undefined" && CONFIG) ? CONFIG : {};
    const SCRIPT_URL = (CFG.SCRIPT_URL || "").trim();
    const SHOP_NAME = (CFG.SHOP_NAME || "DI DI COFFEE").toString().trim();

    let config = { secretKey: "", cooldownSec: 4 };
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        if (typeof saved.secretKey === "string") config.secretKey = saved.secretKey;
        if (saved.cooldownSec) config.cooldownSec = saved.cooldownSec;
      }
    } catch (e) {}

    let html5QrCode = null;
    let isScanning = false;
    let lastScanCode = "";
    let lastScanTime = 0;
    let historyLogs = [];

    const shopNameTitle = document.getElementById("shopNameTitle");
    const resultBox = document.getElementById("resultBox");
    const resTag = document.getElementById("resTag");
    const resTime = document.getElementById("resTime");
    const resGift = document.getElementById("resGift");
    const resSub = document.getElementById("resSub");
    const historyList = document.getElementById("historyList");

    document.title = `${SHOP_NAME.toUpperCase()} - Quét Tặng Quà Tết`;
    shopNameTitle.textContent = SHOP_NAME.toUpperCase();

    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type === "ok" ? "triangle" : "sawtooth";
        osc.frequency.setValueAtTime(type === "ok" ? 820 : (type === "warn" ? 440 : 210), ctx.currentTime);
        gain.gain.setValueAtTime(0.16, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        if (type === "ok") osc.frequency.setValueAtTime(1040, ctx.currentTime + 0.09);
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    function extractCustomerKey(rawText) {
      const text = (rawText || "").trim();
      if (!text) return "";
      try {
        if (text.startsWith("http://") || text.startsWith("https://")) {
          const url = new URL(text);
          const p = url.searchParams.get("code") || url.searchParams.get("key") || url.searchParams.get("ma_khach");
          if (p) return p.toUpperCase().trim();
          const parts = url.pathname.split("/").filter(Boolean);
          if (parts.length) return parts[parts.length - 1].toUpperCase().trim();
        }
      } catch (e) {}
      return text.toUpperCase().trim();
    }

    function nowClock() {
      return new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function setResult(cls, tag, giftText, subText) {
      resultBox.className = "result-box " + cls;
      resTag.textContent = tag;
      resTime.textContent = nowClock();
      resGift.textContent = giftText;
      resSub.textContent = subText;
    }

    function processGiftScan(rawText, onlyCheck = false) {
      const code = extractCustomerKey(rawText);
      if (!code) return;

      const now = Date.now();
      if (code === lastScanCode && (now - lastScanTime) < (config.cooldownSec * 1000)) return;
      lastScanCode = code;
      lastScanTime = now;

      if (!SCRIPT_URL) {
        playSound("err");
        setResult("err", "LỖI CONFIG", "Thiếu SCRIPT_URL", "Kiểm tra lại file config.js.");
        return;
      }

      setResult("load", "ĐANG KIỂM TRA", code, "Đang đọc cột QUÀ & TRẠNG THÁI trên sheet KHACH...");

      const cbName = "didiTetCb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      const scriptEl = document.createElement("script");
      let done = false;

      const cleanup = () => {
        if (scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
        delete window[cbName];
      };

      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        playSound("err");
        setResult("err", "QUÁ GIỜ MẠNG", code, "Không thấy phản hồi từ Apps Script.");
      }, 15000);

      window[cbName] = function(res) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        cleanup();

        if (!res) {
          playSound("err");
          setResult("err", "LỖI DỮ LIỆU", code, "Thử quét lại thẻ.");
          return;
        }

        const cCode = res.code || code;
        const cName = res.name || cCode;
        const cGift = res.gift || "Chưa đủ điều kiện";
        const cPhone = res.phone ? ` • ${res.phone}` : "";

        if (res.status === "SUCCESS" && !res.already_received) {
          playSound("ok");
          setResult(
            "ok",
            onlyCheck ? "CHƯA NHẬN QUÀ" : "ĐÃ CẬP NHẬT: ĐÃ NHẬN",
            cGift,
            `${cName} (${cCode})${cPhone}`
          );
          if (!onlyCheck) addHistory(cCode, cName, cGift, "ĐÃ NHẬN", "ok");
        } else if (res.status === "ALREADY_RECEIVED" || res.already_received) {
          playSound("warn");
          setResult(
            "warn",
            "⚠️ ĐÃ NHẬN QUÀ",
            cGift,
            `${cName} (${cCode})${cPhone} — Trạng thái: ${res.gift_status || "ĐÃ NHẬN"}`
          );
          addHistory(cCode, cName, cGift, "ĐÃ NHẬN", "warn");
        } else {
          playSound("err");
          setResult("err", "KHÔNG THÀNH CÔNG", res.message || cCode, "Kiểm tra KEY/SĐT trên sheet KHACH hoặc Key quầy.");
        }
      };

      const params = new URLSearchParams({
        action: onlyCheck ? "xem_qua_tet" : "tang_qua_tet",
        code: code,
        secret_key: config.secretKey || "",
        callback: cbName
      });

      scriptEl.src = SCRIPT_URL + (SCRIPT_URL.includes("?") ? "&" : "?") + params.toString();
      scriptEl.onerror = function() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        cleanup();
        playSound("err");
        setResult("err", "LỖI KẾT NỐI", code, "Kiểm tra SCRIPT_URL trong config.js.");
      };
      document.body.appendChild(scriptEl);
    }

    function addHistory(code, name, gift, tag, kind) {
      historyLogs.unshift({ code, name, gift, tag, kind, timeStr: nowClock() });
      if (historyLogs.length > 30) historyLogs.pop();
      renderHistory();
    }

    function renderHistory() {
      if (!historyLogs.length) {
        historyList.innerHTML = `<li style="color: var(--muted);">Chưa có lượt nào.</li>`;
        return;
      }
      historyList.innerHTML = historyLogs.map(item => `
        <li class="log-item">
          <div>
            <strong>${item.name}</strong> (${item.code}) —
            <span style="font-weight:800; color:${item.kind === "warn" ? "var(--gold)" : "var(--ok-text)"};">${item.gift} [${item.tag}]</span>
          </div>
          <span style="color: var(--muted);">${item.timeStr}</span>
        </li>
      `).join("");
    }

    document.getElementById("btnClearHistory").addEventListener("click", () => {
      historyLogs = [];
      renderHistory();
    });

    document.getElementById("btnToggleDrawer").addEventListener("click", () => {
      document.getElementById("drawerBox").classList.toggle("open");
    });

    async function startCamera() {
      if (isScanning) return;
      try {
        document.getElementById("camPlaceholder").style.display = "none";
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 200, height: 200 } },
          (decodedText) => processGiftScan(decodedText, false),
          () => {}
        );
        isScanning = true;
        document.getElementById("btnToggleCam").textContent = "⏹ Tắt";
        document.getElementById("btnToggleCam").classList.add("active");
      } catch (err) {
        document.getElementById("camPlaceholder").style.display = "block";
        alert("Không mở được camera. Kiểm tra quyền Camera trên trình duyệt nhé!");
      }
    }

    async function stopCamera() {
      if (!isScanning || !html5QrCode) return;
      try { await html5QrCode.stop(); } catch (e) {}
      isScanning = false;
      document.getElementById("camPlaceholder").style.display = "block";
      document.getElementById("btnToggleCam").textContent = "📷 Cam";
      document.getElementById("btnToggleCam").classList.remove("active");
    }

    document.getElementById("btnToggleCam").addEventListener("click", () => isScanning ? stopCamera() : startCamera());
    document.getElementById("btnStartCamCenter").addEventListener("click", startCamera);

    document.getElementById("btnManualSubmit").addEventListener("click", () => {
      const val = document.getElementById("manualCodeInput").value.trim();
      if (!val) return;
      lastScanCode = "";
      processGiftScan(val, false);
      document.getElementById("manualCodeInput").value = "";
    });

    document.getElementById("btnCheckStatusManual").addEventListener("click", () => {
      const val = document.getElementById("manualCodeInput").value.trim();
      if (!val) {
        alert("Nhập KEY hoặc SĐT vào ô trước nhé!");
        return;
      }
      lastScanCode = "";
      processGiftScan(val, true);
    });

    document.getElementById("btnOpenConfig").addEventListener("click", () => {
      document.getElementById("cfgSecretKey").value = config.secretKey || "";
      document.getElementById("cfgCooldown").value = config.cooldownSec || 4;
      document.getElementById("configModal").classList.add("open");
    });
    document.getElementById("btnCloseConfig").addEventListener("click", () => document.getElementById("configModal").classList.remove("open"));
    document.getElementById("btnSaveConfig").addEventListener("click", () => {
      config.secretKey = document.getElementById("cfgSecretKey").value.trim();
      config.cooldownSec = Math.max(1, parseInt(document.getElementById("cfgCooldown").value, 10) || 4);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      document.getElementById("configModal").classList.remove("open");
      setResult("ok", "ĐÃ LƯU KEY", "Sẵn sàng quét", "Đã lưu mã bảo mật quầy.");
    });
  </script>
</body>
</html>
